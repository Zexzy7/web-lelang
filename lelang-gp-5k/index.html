<body>

  <!-- React 18 Production Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // =========================================================================
    // 1. SHAPE GRID CANVAS BACKGROUND COMPONENT (GEOMETRIC PARTICLES)
    // =========================================================================
    const SHAPES = ['square', 'tile', 'hexagon', 'triangle', 'diamond', 'circle', 'cross', 'dot'];
    const DIRECTIONS = {
      right: [1, 0],
      left: [-1, 0],
      up: [0, -1],
      down: [0, 1],
      diagonal: [Math.SQRT1_2, -Math.SQRT1_2],
      none: [0, 0]
    };
    const SQRT3 = Math.sqrt(3);
    const OFFSET = 32768;
    const FAR = 2.5;
    const MAX_PIXELS = 8e6;

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
    const smoothstep = (edge0, edge1, value) => {
      const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    };
    const smootherstep = t => t * t * t * (t * (t * 6 - 15) + 10);
    const hash = (i, j) => {
      const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453;
      return s - Math.floor(s);
    };
    const keyOf = (i, j) => (i + OFFSET) * 65536 + (j + OFFSET);
    const fadeMask = amount => {
      if (amount <= 0) return 'none';
      const edge = amount * 26;
      const stops = [];
      for (let k = 0; k <= 8; k++) {
        const t = k / 8;
        stops.push(`rgba(0, 0, 0, ${smootherstep(t).toFixed(3)}) ${(t * edge).toFixed(2)}%`);
      }
      const inner = stops.join(', ');
      const outer = [...stops]
        .reverse()
        .map(stop => stop.replace(/ ([\d.]+)%$/, (_, value) => ` ${(100 - parseFloat(value)).toFixed(2)}%`))
        .join(', ');
      return `linear-gradient(to right, ${inner}, ${outer}), linear-gradient(to bottom, ${inner}, ${outer})`;
    };
    const lightnessOf = color => {
      let hex = String(color).trim().replace(/^#/, '');
      if (hex.length === 3 || hex.length === 4) hex = hex.replace(/./g, '$&$&');
      hex = hex.slice(0, 6);
      if (!/^[0-9a-f]{6}$/i.test(hex)) return 0.6;
      const value = parseInt(hex, 16);
      return (Math.max(value >> 16, (value >> 8) & 255, value & 255) + Math.min(value >> 16, (value >> 8) & 255, value & 255)) / 510;
    };
    const tint = (hue, lightness) =>
      `hsl(${(((hue % 360) + 360) % 360).toFixed(1)}, 90%, ${(lightness * 100).toFixed(1)}%)`;
    const multiply = (a, b) =>
      [0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => {
        const r = k - (k % 3);
        const c = k % 3;
        return a[r] * b[c] + a[r + 1] * b[c + 3] + a[r + 2] * b[c + 6];
      });
    const invert = m => {
      const [a, b, c, d, e, f, g, h, i] = m;
      const A = e * i - f * h;
      const B = f * g - d * i;
      const C = d * h - e * g;
      const det = a * A + b * B + c * C;
      return [A, c * h - b * i, b * f - c * e, B, a * i - c * g, c * d - a * f, C, b * g - a * h, a * e - b * d].map(v => v / det);
    };
    const project = (m, x, y) => {
      const w = m[6] * x + m[7] * y + m[8];
      return [(m[0] * x + m[1] * y + m[2]) / w, (m[3] * x + m[4] * y + m[5]) / w];
    };
    const flatView = (width, height) => ({
      x0: 0, y0: 0, width, height, inverse: null, transform: 'none', mist: null, far: FAR, reach: Math.hypot(width, height) / 2
    });
    const viewFor = (tiltX, tiltY, width, height, cellSize) => {
      if (!tiltX && !tiltY) return flatView(width, height);
      return flatView(width, height);
    };
    const layoutFor = (shape, size) => ({ stepX: size, stepY: size });
    const centerOf = (shape, layout, i, j) => [(i + 0.5) * layout.stepX, (j + 0.5) * layout.stepY];
    const traceCell = (ctx, shape, layout, size, i, j, x, y, inset) => {
      const half = size / 2 - inset;
      ctx.rect(x - half, y - half, half * 2, half * 2);
    };

    function ShapeGrid({
      shape = 'square',
      cellSize = 40,
      lineWidth = 1,
      direction = 'diagonal',
      speed = 0.5,
      lineColor = '#2a2734',
      hoverColor = '#ffffff',
      hoverFillColor,
      fillOpacity = 0.15,
      rainbow = false,
      tiltX = 0,
      tiltY = 0,
      radius = 1.5,
      trail = 0.6,
      glow = 0.35,
      twinkle = 0,
      fade = 1,
      clickCascade = true,
      intro = true,
      opacity = 1,
      backgroundColor = 'transparent',
      paused = false,
      dpr,
      className = '',
      style
    }) {
      const containerRef = useRef(null);
      const canvasRef = useRef(null);
      const engineRef = useRef(null);
      const settingsRef = useRef(null);

      settingsRef.current = {
        shape: 'square',
        cellSize: Math.max(8, cellSize),
        lineWidth: Math.max(0.25, lineWidth),
        direction: 'diagonal',
        speed: Math.max(0, speed),
        lineColor,
        hoverColor,
        hoverFillColor: hoverFillColor ?? hoverColor,
        fillOpacity: clamp(fillOpacity, 0, 1),
        rainbow,
        tone: clamp(lightnessOf(hoverColor), 0.45, 0.68),
        tiltX: 0,
        tiltY: 0,
        radius: Math.max(0, radius),
        trail: Math.max(0.05, trail),
        glow: clamp(glow, 0, 1),
        twinkle: clamp(twinkle, 0, 1),
        clickCascade,
        intro,
        paused,
        dpr
      };

      useEffect(() => {
        const container = containerRef.current;
        const canvas = canvasRef.current;
        if (!container || !canvas) return undefined;
        const ctx = canvas.getContext('2d');
        if (!ctx) return undefined;

        const state = {
          alive: true,
          raf: 0,
          last: 0,
          time: 0,
          visible: true,
          width: 1,
          height: 1,
          ratio: 1,
          view: flatView(1, 1),
          offsetX: 0,
          offsetY: 0,
          started: false,
          startedAt: 0,
          inside: false,
          pointerX: 0,
          pointerY: 0,
          spotX: 0,
          spotY: 0,
          spotVX: 0,
          spotVY: 0,
          spotPower: 0,
          lit: new Map(),
          hues: new Map(),
          cascades: [],
          cascadeHue: 0
        };

        const resize = () => {
          const s = settingsRef.current;
          const width = Math.max(1, container.clientWidth);
          const height = Math.max(1, container.clientHeight);
          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          state.width = width;
          state.height = height;
          state.ratio = ratio;
          state.view = flatView(width, height);
          const pw = Math.max(1, Math.round(width * ratio));
          const ph = Math.max(1, Math.round(height * ratio));
          if (canvas.width !== pw || canvas.height !== ph) {
            canvas.width = pw;
            canvas.height = ph;
          }
        };

        const range = (layout, margin) => {
          const { stepX, stepY } = layout;
          const { view } = state;
          return [
            Math.floor((state.offsetX - margin) / stepX) - 1,
            Math.ceil((state.offsetX + view.width + margin) / stepX) + 1,
            Math.floor((state.offsetY - margin) / stepY) - 1,
            Math.ceil((state.offsetY + view.height + margin) / stepY) + 1
          ];
        };

        const draw = () => {
          const s = settingsRef.current;
          const { view, ratio } = state;
          const layout = layoutFor(s.shape, s.cellSize);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

          const size = s.cellSize;
          const [i0, i1, j0, j1] = range(layout, size);

          ctx.lineWidth = s.lineWidth;
          ctx.strokeStyle = s.lineColor;
          ctx.beginPath();
          for (let i = i0; i <= i1; i++) {
            const x = i * layout.stepX - state.offsetX;
            ctx.moveTo(x, -size);
            ctx.lineTo(x, view.height + size);
          }
          for (let j = j0; j <= j1; j++) {
            const y = j * layout.stepY - state.offsetY;
            ctx.moveTo(-size, y);
            ctx.lineTo(view.width + size, y);
          }
          ctx.stroke();

          // Spot light on hover
          if (state.spotPower > 0.01) {
            const wx = state.spotX + state.offsetX;
            const wy = state.spotY + state.offsetY;
            const hi = Math.round(wx / layout.stepX);
            const hj = Math.round(wy / layout.stepY);
            for (let i = hi - 3; i <= hi + 3; i++) {
              for (let j = hj - 3; j <= hj + 3; j++) {
                const [cx, cy] = centerOf(s.shape, layout, i, j);
                const d = Math.hypot(cx - wx, cy - wy);
                const val = Math.max(0, 1 - d / (size * 3.5)) * state.spotPower;
                if (val > 0.02) {
                  ctx.fillStyle = s.hoverColor;
                  ctx.globalAlpha = val * s.fillOpacity;
                  ctx.fillRect(cx - state.offsetX - size / 2, cy - state.offsetY - size / 2, size, size);
                  ctx.globalAlpha = 1;
                }
              }
            }
          }
        };

        const frame = now => {
          state.raf = 0;
          if (!state.alive) return;
          const dt = state.last ? Math.min(0.05, (now - state.last) / 1000) : 1 / 60;
          state.last = now;
          resize();
          const [dx, dy] = DIRECTIONS['diagonal'];
          state.offsetX -= dx * settingsRef.current.speed * 40 * dt;
          state.offsetY -= dy * settingsRef.current.speed * 40 * dt;
          const want = state.inside ? 1 : 0;
          state.spotPower += (want - state.spotPower) * 0.12;
          draw();
          state.raf = requestAnimationFrame(frame);
        };

        const onMove = e => {
          const rect = container.getBoundingClientRect();
          state.pointerX = e.clientX - rect.left;
          state.pointerY = e.clientY - rect.top;
          state.spotX = state.pointerX;
          state.spotY = state.pointerY;
          state.inside = true;
        };

        const onLeave = () => { state.inside = false; };

        window.addEventListener('pointermove', onMove, { passive: true });
        document.documentElement.addEventListener('pointerleave', onLeave);
        state.raf = requestAnimationFrame(frame);

        return () => {
          state.alive = false;
          cancelAnimationFrame(state.raf);
          window.removeEventListener('pointermove', onMove);
          document.documentElement.removeEventListener('pointerleave', onLeave);
        };
      }, []);

      const mask = fadeMask(clamp(fade, 0, 1));
      return (
        <div
          ref={containerRef}
          className={`shape-grid ${className}`.trim()}
          style={{
            opacity: clamp(opacity, 0, 1),
            backgroundColor,
            ...(mask === 'none' ? null : { maskImage: mask, WebkitMaskImage: mask }),
            ...style
          }}
        >
          <canvas ref={canvasRef} className="shape-grid-canvas" />
        </div>
      );
    }

    // =========================================================================
    // 2. HARDCODED MASTER SPECIFICATION & PROCEDURAL AUDIO SYNTHESIZER
    // =========================================================================
    const HARDCODED = {
      adminUser: 'Jeyssen',
      adminPass: '2772772',
      adminPhone: '6287747091072',
      defaultPrice: 5000,
      defaultSlots: 15,
      defaultPrize: '35.000 GP'
    };

    class WebAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playTick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(540 + Math.random() * 40, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.035);
          gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.035);
        } catch (e) {}
      }
      playChime() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = this.ctx.currentTime + idx * 0.1;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.2, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.7);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.75);
          });
        } catch (e) {}
      }
    }

    const sound = new WebAudioEngine();

    // =========================================================================
    // 3. MAIN REACT APP COMPONENT (V4 PRODUCTION WITH QRIS & MUTASI VERIFICATION)
    // =========================================================================
    function App() {
      // Config State
      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('lelang_gp_config_v4');
          return saved ? JSON.parse(saved) : {
            totalSlots: HARDCODED.defaultSlots,
            pricePerSlot: HARDCODED.defaultPrice,
            prizePool: HARDCODED.defaultPrize,
            phone: HARDCODED.adminPhone
          };
        } catch {
          return {
            totalSlots: HARDCODED.defaultSlots,
            pricePerSlot: HARDCODED.defaultPrice,
            prizePool: HARDCODED.defaultPrize,
            phone: HARDCODED.adminPhone
          };
        }
      });

      // Slots State
      // Statuses: 'available', 'pending', 'verified'
      const [slots, setSlots] = useState(() => {
        try {
          const saved = localStorage.getItem('lelang_gp_slots_v4');
          if (saved) return JSON.parse(saved);
        } catch {}
        return Array.from({ length: HARDCODED.defaultSlots }, (_, i) => ({
          id: i + 1,
          status: 'available', // 'available' | 'pending' | 'verified'
          username: '',
          senderName: '',
          timestamp: null
        }));
      });

      // Admin Auth State (Jeyssen / 2772772)
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(() => {
        return sessionStorage.getItem('lelang_admin_auth_v4') === 'true';
      });
      const [isAdminDrawerOpen, setIsAdminDrawerOpen] = useState(false);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState(false);

      // QRIS & Checkout Modal
      const [checkoutModalOpen, setCheckoutModalOpen] = useState(false);
      const [selectedSlotId, setSelectedSlotId] = useState(1);
      const [checkoutUsername, setCheckoutUsername] = useState('');
      const [checkoutSenderName, setCheckoutSenderName] = useState('');

      // Winner Modal
      const [winnerModalOpen, setWinnerModalOpen] = useState(false);
      const [winnerData, setWinnerData] = useState(null);

      // Wheel Canvas Physics
      const [isSpinning, setIsSpinning] = useState(false);
      const wheelCanvasRef = useRef(null);
      const rotationRef = useRef(0);
      const pointerRef = useRef(null);
      const lastTickIndexRef = useRef(-1);

      // Multi-Tab LocalStorage Synchronization
      useEffect(() => {
        localStorage.setItem('lelang_gp_config_v4', JSON.stringify(config));
      }, [config]);

      useEffect(() => {
        localStorage.setItem('lelang_gp_slots_v4', JSON.stringify(slots));
      }, [slots]);

      useEffect(() => {
        const handleStorage = (e) => {
          if (e.key === 'lelang_gp_slots_v4' && e.newValue) {
            try { setSlots(JSON.parse(e.newValue)); } catch {}
          }
          if (e.key === 'lelang_gp_config_v4' && e.newValue) {
            try { setConfig(JSON.parse(e.newValue)); } catch {}
          }
        };
        window.addEventListener('storage', handleStorage);
        return () => window.removeEventListener('storage', handleStorage);
      }, []);

      // Unlock Audio on user gesture
      useEffect(() => {
        const unlock = () => sound.init();
        window.addEventListener('click', unlock, { once: true });
        return () => window.removeEventListener('click', unlock);
      }, []);

      // Statistics
      const totalCount = slots.length;
      const verifiedSlots = useMemo(() => slots.filter(s => s.status === 'verified'), [slots]);
      const pendingSlots = useMemo(() => slots.filter(s => s.status === 'pending'), [slots]);
      const occupiedCount = verifiedSlots.length;
      const remainingCount = totalCount - occupiedCount;
      const percentFilled = Math.round((occupiedCount / totalCount) * 100);
      const isFull = occupiedCount === totalCount;

      // Admin Auth Handlers
      const handleAdminToggle = () => {
        if (isAdminAuthenticated) {
          setIsAdminDrawerOpen(!isAdminDrawerOpen);
        } else {
          setLoginUser('');
          setLoginPass('');
          setLoginError(false);
          setIsLoginModalOpen(true);
        }
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (loginUser === HARDCODED.adminUser && loginPass === HARDCODED.adminPass) {
          setIsAdminAuthenticated(true);
          sessionStorage.setItem('lelang_admin_auth_v4', 'true');
          setIsLoginModalOpen(false);
          setIsAdminDrawerOpen(true);
          setLoginError(false);
        } else {
          setLoginError(true);
          setTimeout(() => setLoginError(false), 800);
        }
      };

      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        setIsAdminDrawerOpen(false);
        sessionStorage.removeItem('lelang_admin_auth_v4');
      };

      // Checkout & QRIS Submission
      const openCheckout = (slotId) => {
        setSelectedSlotId(slotId);
        setCheckoutUsername('');
        setCheckoutSenderName('');
        setCheckoutModalOpen(true);
      };

      const handleCheckoutSubmit = (e) => {
        e.preventDefault();
        let u = checkoutUsername.trim();
        let sName = checkoutSenderName.trim();
        if (!u) {
          alert('Silakan masukkan username TikTok Anda.');
          return;
        }
        if (!sName) {
          alert('Silakan masukkan Nama Pengirim / Akun DANA/Bank sesuai mutasi transfer.');
          return;
        }
        if (!u.startsWith('@')) u = `@${u}`;

        const target = slots.find(s => s.id === selectedSlotId);
        if (!target || target.status === 'verified') {
          alert('Nomor kupon ini sudah terisi dan terverifikasi.');
          return;
        }

        // Set slot to pending verification
        setSlots(prev => prev.map(s => s.id === selectedSlotId ? {
          ...s,
          status: 'pending',
          username: u,
          senderName: sName,
          timestamp: new Date().toLocaleTimeString('id-ID')
        } : s));

        setCheckoutModalOpen(false);

        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const size = canvas.width;
        const center = size / 2;
        const radius = center - 16;

        ctx.clearRect(0, 0, size, size);

        let activeParticipants = verifiedSlots;
        const isPlaceholder = activeParticipants.length === 0;
        if (isPlaceholder) activeParticipants = slots;

        const count = activeParticipants.length;
        const sliceAngle = (Math.PI * 2) / count;

        const colors = [
          ['#0d0e12', '#16181f'],
          ['#064e3b', '#065f46'],
          ['#1e1b4b', '#2e2a72'],
          ['#451a03', '#78350f'],
          ['#083344', '#155e75']
        ];

        for (let i = 0; i < count; i++) {
          const item = activeParticipants[i];
          const start = rotationRef.current + i * sliceAngle;
          const end = start + sliceAngle;
          const pair = colors[i % colors.length];

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(center, center);
          ctx.arc(center, center, radius, start, end);
          ctx.closePath();

          const grad = ctx.createRadialGradient(center, center, 40, center, center, radius);
          grad.addColorStop(0, pair[1]);
          grad.addColorStop(1, pair[0]);
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.stroke();

          // Slice Label
          ctx.translate(center, center);
          ctx.rotate(start + sliceAngle / 2);
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';

          ctx.font = '700 20px "JetBrains Mono", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`#${item.id.toString().padStart(2, '0')}`, radius - 24, 0);

          ctx.font = '600 13px "Inter", sans-serif';
          ctx.fillStyle = item.status === 'verified' ? '#38bdf8' : 'rgba(255, 255, 255, 0.35)';
          const label = item.status === 'verified'
            ? (item.username.length > 12 ? item.username.slice(0, 10) + '..' : item.username)
            : 'Tersedia';
          ctx.fillText(label, radius - 80, 0);

          ctx.restore();
        }

        // Rim
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.stroke();

        // Hub
        ctx.beginPath();
        ctx.arc(center, center, 36, 0, Math.PI * 2);
        ctx.fillStyle = '#08090a';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
